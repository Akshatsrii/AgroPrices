version: '3.8'

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: agroprice_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db


  # 3. Python ML Microservice
  ml_service:
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    container_name: agroprice_ml_service
    restart: always
    ports:
      - "8000:8000"

  # 4. Express Node.js Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agroprice_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/agroprice

      - ML_SERVICE_URL=http://ml_service:8000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET environment variable is missing and required}
    depends_on:
      - mongodb

      - ml_service

  # 5. React Frontend Nginx Server
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: agroprice_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
