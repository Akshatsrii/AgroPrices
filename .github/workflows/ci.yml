name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    - name: Install dependencies
      working-directory: ./backend
      run: npm install
    - name: Run Backend Tests
      working-directory: ./backend
      run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    - name: Install dependencies
      working-directory: ./frontend
      run: npm install
    - name: Run Linter
      working-directory: ./frontend
      run: npm run lint
    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build
